<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="A simple note-paper task list."><title>Little Notes — task list</title><link rel="stylesheet" href="stylesheet.css"></head><body><main class="desk"><div class="tape tape-left"></div><div class="tape tape-right"></div><section class="paper"><header class="paper-header"><div><p class="eyebrow">MY DAILY NOTE</p><h1>Things to do<span>.</span></h1></div><div class="date" id="date"></div></header><div class="rule"></div><section class="task-section"><div class="section-title"><span>YOUR TASKS</span><span id="taskCount">0 tasks</span></div><div id="taskList" class="task-list" aria-live="polite"></div><p id="emptyState" class="empty-state">Your page is clear.<br><span>Add a little something to begin.</span></p></section><button class="add-task" id="addTask" type="button"><span>＋</span> Add task</button><footer><span>ONE THING AT A TIME</span><span>✦</span></footer></section></main><div class="modal-backdrop" id="difficultyModal" hidden><section class="difficulty-card" role="dialog" aria-modal="true" aria-labelledby="difficultyTitle"><button class="close" id="closeModal" type="button" aria-label="Close">×</button><p class="eyebrow">NEW NOTE</p><h2 id="difficultyTitle">How hard is this<br><em>little task?</em></h2><p class="selected-task" id="selectedTask"></p><div class="difficulty-options" id="difficultyOptions"><button type="button" data-difficulty="easy"><b>01</b><span><strong>Easy</strong><small>A quick win · 10 min</small></span><i>☼</i></button><button type="button" data-difficulty="medium"><b>02</b><span><strong>Medium</strong><small>Needs a little focus</small></span><i>✦</i></button><button type="button" data-difficulty="hard"><b>03</b><span><strong>Hard</strong><small>A bigger challenge</small></span><i>◆</i></button></div></section></div><script>
const KEY='littleNotesTasks', state={tasks:JSON.parse(localStorage.getItem(KEY)||'[]'),pending:'',chooseFirst:false,pendingDifficulty:''}, $=s=>document.querySelector(s), save=()=>localStorage.setItem(KEY,JSON.stringify(state.tasks)); state.tasks=state.tasks.map(t=>typeof t==='string'?{text:t,difficulty:'medium'}:{text:t.text||'',difficulty:t.difficulty||'medium'}); save(); const esc=v=>v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
$('#date').textContent=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date()).toUpperCase();
function render(){const n=state.tasks.length;$('#taskCount').textContent=`${n} ${n===1?'task':'tasks'}`;$('#emptyState').hidden=n!==0;$('#taskList').innerHTML=state.tasks.map((t,i)=>`<article class="task-row ${t.difficulty}"><button class="check" type="button" data-complete="${i}" aria-label="Complete ${esc(t.text)}">✓</button><div class="task-copy"><strong>${esc(t.text)}</strong><small>${t.difficulty}</small></div><span class="task-number">${String(i+1).padStart(2,'0')}</span></article>`).join('');document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{b.closest('.task-row').classList.add('completed');setTimeout(()=>{state.tasks.splice(+b.dataset.complete,1);save();render()},260)})}
function addButton(){const b=document.createElement('button');b.className='add-task';b.id='addTask';b.type='button';b.innerHTML='<span>＋</span> Add task';b.onclick=beginTask;return b} function beginTask(){state.chooseFirst=true;$('#selectedTask').textContent='Choose a difficulty mode first.';$('#difficultyModal').hidden=false;document.body.classList.add('modal-open')} function beginTaskInput(){const input=document.createElement('input');input.className='task-input';input.maxLength=80;input.placeholder='What needs doing?';input.autocomplete='off';input.onkeydown=e=>{if(e.key==='Enter')submitTask(input)};$('#addTask').replaceWith(input);input.focus();input.onblur=()=>setTimeout(()=>{if(document.body.contains(input))submitTask(input)},120)} function submitTask(input){const text=input.value.trim();if(!text){input.replaceWith(addButton());return}state.pending=text;if(state.pendingDifficulty){state.tasks.push({text,difficulty:state.pendingDifficulty});state.pendingDifficulty='';save();render();input.replaceWith(addButton());return}$('#selectedTask').textContent=`“${text}”`;$('#difficultyModal').hidden=false;document.body.classList.add('modal-open');input.replaceWith(addButton())}
$('#addTask').onclick=beginTask;$('#closeModal').onclick=()=>{$('#difficultyModal').hidden=true;document.body.classList.remove('modal-open')};$('#difficultyModal').onclick=e=>{if(e.target.id==='difficultyModal')$('#closeModal').click()};document.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{if(state.chooseFirst){state.chooseFirst=false;state.pendingDifficulty=b.dataset.difficulty;$('#closeModal').click();beginTaskInput()}else{state.tasks.push({text:state.pending,difficulty:b.dataset.difficulty});save();render();$('#closeModal').click()}});render();
</script><script>const sortButton=document.createElement('button');sortButton.className='sort-button';sortButton.textContent='Sort by difficulty';sortButton.type='button';$('#addTask').before(sortButton);let sorted=false;sortButton.onclick=()=>{sorted=!sorted;sortButton.textContent=sorted?'Show task list':'Sort by difficulty';if(sorted)renderGroups();else render()};function renderGroups(){const groups=['easy','medium','hard'];$('#taskList').innerHTML=groups.map(level=>{const items=state.tasks.map((t,i)=>({...t,index:i})).filter(t=>t.difficulty===level);return `<section class="difficulty-group"><h3>${level}<span>${items.length} ${items.length===1?'task':'tasks'}</span></h3>${items.map(t=>`<article class="task-row ${t.difficulty}"><button class="check" type="button" data-complete="${t.index}">✓</button><div class="task-copy"><strong>${esc(t.text)}</strong><small>${t.difficulty}</small></div></article>`).join('')||'<p class="group-empty">No tasks here.</p>'}</section>`}).join('');document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const index=+b.dataset.complete;const level=state.tasks[index].difficulty;b.closest('.task-row').classList.add('completed');setTimeout(()=>{state.tasks.splice(index,1);save();renderGroups();if(!state.tasks.some(t=>t.difficulty===level))showReward(level)},260)})}function showReward(level){const reward=document.createElement('div');reward.className='reward';reward.innerHTML=`<strong>${level.toUpperCase()} GROUP COMPLETE ✦</strong><span>You earned a 5-minute break and game time.</span><button id="gameTime" type="button">Start 5-minute game time</button>`;document.querySelector('.paper').appendChild(reward);$('#gameTime').onclick=()=>{reward.classList.add('playing');reward.querySelector('button').textContent='Game time started · 5:00';let seconds=300;const timer=setInterval(()=>{seconds--;reward.querySelector('button').textContent=`Game time · ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(timer);reward.querySelector('button').textContent='Game time complete'}},1000)}}}</script></body></html>
<script>document.addEventListener('DOMContentLoaded',()=>{if(!document.querySelector('.sort-button')){const b=document.createElement('button');b.className='sort-button';b.textContent='Sort by difficulty';b.type='button';b.onclick=()=>{document.querySelectorAll('.difficulty-group').forEach(g=>g.hidden=!g.hidden)};document.querySelector('#addTask').before(b)}})</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const sort=document.querySelector('.sort-button');if(!sort)return;sort.onclick=()=>{let modal=document.querySelector('.arrange-modal');if(!modal){modal=document.createElement('div');modal.className='arrange-modal';modal.innerHTML='<div class="arrange-card"><button class="arrange-close" type="button">×</button><p class="eyebrow">ORGANIZE YOUR NOTE</p><h2>How should we<br><em>arrange it?</em></h2><div class="arrange-options"><button data-order="easy">Easy tasks first <span>☼</span></button><button data-order="medium">Medium tasks first <span>✦</span></button><button data-order="hard">Hard tasks first <span>◆</span></button></div></div>';document.body.appendChild(modal);modal.querySelector('.arrange-close').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{const order=['easy','medium','hard'];const first=b.dataset.order;state.tasks.sort((a,c)=>order.indexOf(a.difficulty===first?first:a.difficulty)-order.indexOf(c.difficulty===first?first:c.difficulty));save();render();modal.remove()})}modal.hidden=false}});const style=document.createElement('style');style.textContent='.arrange-modal{position:fixed;inset:0;background:#28312b66;display:grid;place-items:center;padding:20px;z-index:20}.arrange-card{position:relative;width:min(440px,100%);background:var(--paper);padding:42px;box-shadow:0 18px 50px #1f282055}.arrange-close{position:absolute;right:20px;top:15px;border:0;background:none;font-size:27px;color:var(--muted);cursor:pointer}.arrange-card h2{font-size:40px;line-height:.95;letter-spacing:-.07em;margin:0 0 25px}.arrange-card h2 em{font-family:Playfair Display,serif;font-weight:500}.arrange-options{display:grid;gap:9px}.arrange-options button{display:flex;justify-content:space-between;border:1px solid var(--line);background:transparent;padding:15px;text-align:left;font:12px DM Mono,monospace;cursor:pointer}.arrange-options button:hover{background:var(--mint);border-color:var(--ink)}.arrange-options span{font-size:17px}@media(max-width:600px){.arrange-card{padding:35px 25px}}';document.head.appendChild(style)</script>
<script>const sortFix=setInterval(()=>{const sort=document.querySelector('.sort-button');if(!sort||typeof state==='undefined')return;clearInterval(sortFix);sort.onclick=()=>{const modal=document.createElement('div');modal.className='arrange-modal';modal.innerHTML='<div class="arrange-card"><button class="arrange-close" type="button">×</button><p class="eyebrow">ORGANIZE YOUR NOTE</p><h2>How should we<br><em>arrange it?</em></h2><div class="arrange-options"><button data-order="easy">Easy tasks first <span>☼</span></button><button data-order="medium">Medium tasks first <span>✦</span></button><button data-order="hard">Hard tasks first <span>◆</span></button></div></div>';document.body.appendChild(modal);modal.querySelector('.arrange-close').onclick=()=>modal.remove();modal.querySelectorAll('[data-order]').forEach(option=>option.onclick=()=>{const first=option.dataset.order;const order={easy:0,medium:1,hard:2};state.tasks.sort((a,b)=>{const av=a.difficulty===first?0:order[a.difficulty]+1;const bv=b.difficulty===first?0:order[b.difficulty]+1;return av-bv});save();render();modal.remove()})}},100)</script>
<script>const rewardFix=setInterval(()=>{if(typeof showReward!=='function'||typeof state==='undefined')return;clearInterval(rewardFix);showReward=(level)=>{const reward=document.createElement('div');reward.className='reward yellow-reward';reward.innerHTML='<strong>'+level.toUpperCase()+' GROUP COMPLETE ✦</strong><span>You earned a 5-minute break.</span><button id="openGame" type="button">Open game time</button>';document.querySelector('.paper').appendChild(reward);reward.querySelector('#openGame').onclick=()=>{const game=document.createElement('div');game.className='game-page';game.innerHTML='<button class="game-back" type="button">← Back to tasks</button><div class="game-placeholder"><p class="eyebrow">GAME TIME</p><h2>Your game<br><em>goes here.</em></h2><p>This is a placeholder for your future game.</p><small>REMOVE THIS .game-placeholder BLOCK WHEN YOU ADD YOUR GAME.</small></div>';document.body.appendChild(game);game.querySelector('.game-back').onclick=()=>game.remove()}}},100)</script>
<script>const completionRewardFix=setInterval(()=>{if(typeof state==='undefined'||typeof save==='undefined')return;clearInterval(completionRewardFix);document.addEventListener('click',event=>{const check=event.target.closest('.check');if(!check||check.dataset.rewardBound)return;check.dataset.rewardBound='1';const row=check.closest('.task-row');const level=row&&row.classList.contains('easy')?'easy':row&&row.classList.contains('hard')?'hard':'medium';setTimeout(()=>{if(state.tasks.some(t=>t.difficulty===level)||document.querySelector('.yellow-reward'))return;const reward=document.createElement('div');reward.className='reward yellow-reward';reward.innerHTML='<strong>'+level.toUpperCase()+' GROUP COMPLETE ✦</strong><span>You earned a 5-minute break.</span><button type="button">Open game time</button>';document.querySelector('.paper').appendChild(reward);reward.querySelector('button').onclick=()=>{const game=document.createElement('div');game.className='game-page';game.innerHTML='<button class="game-back" type="button">← Back to tasks</button><div class="game-placeholder"><p class="eyebrow">GAME TIME</p><h2>Your game<br><em>goes here.</em></h2><p>This is a placeholder for your future game.</p><small>REMOVE THIS .game-placeholder BLOCK WHEN YOU ADD YOUR GAME.</small></div>';document.body.appendChild(game);game.querySelector('.game-back').onclick=()=>game.remove()},100})},100)</script>
<script>(function(){const boot=setInterval(function(){if(!window.document.querySelector('.task-list')||typeof state==='undefined')return;clearInterval(boot);document.addEventListener('click',function(e){const check=e.target.closest('.check');if(!check)return;const row=check.closest('.task-row');const level=row.classList.contains('easy')?'easy':row.classList.contains('hard')?'hard':'medium';setTimeout(function(){const remaining=state.tasks.filter(function(t){return t.difficulty===level}).length;if(remaining!==0||document.querySelector('.force-game-button'))return;const button=document.createElement('button');button.className='force-game-button';button.textContent='Open game time';document.body.appendChild(button);button.onclick=function(){const page=document.createElement('div');page.className='game-page';page.innerHTML='<button class="game-back" type="button">← Back to tasks</button><div class="game-placeholder"><p class="eyebrow">GAME TIME</p><h2>Your game<br><em>goes here.</em></h2><p>This is a placeholder for your future game.</p><small>REMOVE THIS .game-placeholder BLOCK WHEN YOU ADD YOUR GAME.</small></div>';document.body.appendChild(page);page.querySelector('.game-back').onclick=function(){page.remove()};button.remove()},500)},true)},100)})();</script>
